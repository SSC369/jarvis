<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
  <style>
:root{
  --paper:#faf8f4; --surface:#ffffff; --ink:#2f2823; --ink2:#6b625a; --ink3:#9c9389;
  --line:#e7e0d5; --line2:#d6ccbc; --rail:#f5f1ea; --blue:#2f5ea8; --blueWash:#eef3fb;
  --amber:#8a5a2b; --amberWash:#f8f1e6; --red:#a83f36; --redWash:#fbf0ee; --green:#2f7a52; --greenWash:#edf6f1;
}
*{box-sizing:border-box}
body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.ph{width:390px;height:844px;display:flex;flex-direction:column;background:var(--paper);position:relative}
.safe{height:44px;flex-shrink:0}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.mtitle{font-size:16px;font-weight:600}
.histbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--blueWash);color:var(--blue)}
.mbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;filter:blur(1px);opacity:.5}
.mtabs{height:64px;flex-shrink:0;border-top:1px solid var(--line);background:#f5f1ea;display:flex;filter:blur(1px);opacity:.5}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:500;color:var(--ink2)}
.mtab.on{color:var(--blue)}
.homebar{height:22px;flex-shrink:0;background:#f5f1ea}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin:0 14px}
.cardhead{display:flex;align-items:center;gap:9px;padding:12px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:20px;
  font-size:11px;font-weight:500;border:1px solid transparent}
.pill.done{background:var(--greenWash);color:var(--green);border-color:#d3e7dd}
/* Overlay + panel, mobile: panel = viewport minus 40px, anchored right */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.panel{position:absolute;top:0;right:0;bottom:0;width:350px;background:var(--surface);
  box-shadow:-16px 0 40px rgba(47,40,35,.16);display:flex;flex-direction:column}
.phead{height:56px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px}
.ptitle{font-size:15px;font-weight:600}
.pclose{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.pbody{flex:1;overflow:hidden;padding:0 16px}
.row{border-bottom:1px solid var(--line);padding:13px 0}
.row:last-child{border-bottom:0}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rtime{font-size:11px;color:var(--ink3);flex-shrink:0}
.rinput{font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-top:7px}
.rdetail{font-size:12px;color:var(--ink2);margin-top:5px}
.pillsm{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:20px;
  font-size:11px;font-weight:500;border:1px solid transparent}
.pillsm.wait{background:var(--blueWash);color:var(--blue);border-color:#d7e2f3}
.pillsm.done{background:var(--greenWash);color:var(--green);border-color:#d3e7dd}
.pillsm.muted{background:var(--surface);color:var(--ink3);border-color:var(--line2)}
</style>
</helmet>
<div class="ph">
  <div class="safe"></div>
  <div class="mhead"><div class="mtitle">Capture</div><div class="histbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><polyline points="12 7.5 12 12 15.5 14"/></svg></div></div>
  <div class="mbody">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:8px">
      <div class="card">
        <div class="cardhead"><span class="pill done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9 17.5 20 6.5"/></svg> Task created</span></div>
      </div>
    </div>
  </div>
  <div class="mtabs">
    <div class="mtab" style="color:var(--blue)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 9 12 5 16"/><line x1="12" y1="16" x2="19" y2="16"/></svg><span>Capture</span></div>
    <div class="mtab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>Records</span></div>
    <div class="mtab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span>Settings</span></div>
  </div>
  <div class="homebar"></div>

  <div class="overlay"></div>
  <div class="panel">
    <div class="phead"><div class="ptitle">History</div><div class="pclose"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></div></div>
    <div class="pbody">

      <div class="row">
        <div class="rowhead"><span class="pillsm wait"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg> Question asked</span><span class="rtime">2m ago</span></div>
        <div class="rinput">/add-task</div>
        <div class="rdetail">Asked: What should the task be called?</div>
      </div>

      <div class="row">
        <div class="rowhead"><span class="pillsm done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9 17.5 20 6.5"/></svg> Task created</span><span class="rtime">18m ago</span></div>
        <div class="rinput">/add-task pack for the trip</div>
        <div class="rdetail">Asked: When is this due?</div>
        <div class="rdetail">Answered: Friday</div>
      </div>

      <div class="row">
        <div class="rowhead"><span class="pillsm muted"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 6 7 20 7"/><path d="M18 7v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7m3 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg> Discarded</span><span class="rtime">1h ago</span></div>
        <div class="rinput">/add-task</div>
        <div class="rdetail">Asked: What should the task be called?</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
