#import "../../../fragments/TaskFields.graphql"

mutation UpdateTask($id: ID!, $input: UpdateTaskInput!) {
  updateTask(id: $id, input: $input) {
    __typename
    ... on Task {
      ...TaskFields
    }
    ... on NoFieldsToUpdate {
      message
    }
    ... on RecordNotFound {
      message
    }
  }
}
