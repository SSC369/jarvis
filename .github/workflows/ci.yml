name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        run: pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Requirement NFR-1: the credential does not appear outside the server
      # environment. Zero occurrences is the only acceptable number, so this
      # job scans full history rather than the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
